{{> header}}

<div class="page-header">
  <h1>＋ Create New Table</h1>
  <a href="/tables" class="btn btn-ghost">← Back</a>
</div>

<div class="card" style="max-width:580px">
  <form method="POST" action="/create-table">
    <div class="form-group">
      <label>Table Name</label>
      <input type="text" name="tableName" placeholder="e.g. products, orders, users"
             pattern="[a-zA-Z0-9_]+" title="Letters, numbers, underscores only"
             required autofocus />
      <div class="text-muted mt-1" style="font-size:.78rem">
        Only letters, numbers, and underscores. Stored as <code>data/{name}.json</code>
      </div>
    </div>

    <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <p class="section-title" style="margin:0">Define Fields</p>
        <p style="font-size:.875rem;color:var(--muted);margin:0">(Optional)</p>
      </div>
      
      <div id="dynamic-fields"></div>
      
      <button type="button" class="btn btn-ghost btn-sm" onclick="addField()">
        ＋ Add Field
      </button>
      
      <div class="text-muted mt-2" style="font-size:.78rem">
        You can add fields now or later when adding the first record.
      </div>
    </div>

    <div style="display:flex;gap:.75rem;margin-top:1.5rem">
      <button type="submit" class="btn btn-primary">🗃 Create Table</button>
      <a href="/" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

<script>
  var fieldCount = 0;
  
  function addField() {
    fieldCount++;
    var container = document.getElementById('dynamic-fields');
    var div = document.createElement('div');
    div.className = 'form-group';
    div.style.cssText = 'display:flex;gap:.5rem;align-items:flex-end;margin-bottom:.75rem';

    var nameWrap = document.createElement('div');
    nameWrap.style.flex = '1';
    var nLabel = document.createElement('label');
    nLabel.textContent = 'Field Name';
    nLabel.style.display = 'block';
    nLabel.style.fontSize = '.85rem';
    var nInput = document.createElement('input');
    nInput.type = 'text';
    nInput.placeholder = 'field_name';
    nInput.name = 'field_name_' + fieldCount;
    nInput.className = 'field-name-input';
    nameWrap.appendChild(nLabel);
    nameWrap.appendChild(nInput);

    var rm = document.createElement('button');
    rm.type = 'button';
    rm.textContent = '✕';
    rm.className = 'btn btn-danger btn-sm';
    rm.addEventListener('click', function() { container.removeChild(div); });

    div.appendChild(nameWrap);
    div.appendChild(rm);

    container.appendChild(div);
    nInput.focus();
  }
</script>

{{> footer}}
